name: flutterware_web_demo
description: The studio's web demo — the shell over a recording of the demo app, with the demo app's previews compiled in. Never published.
publish_to: none

environment:
  sdk: ^3.13.0-0

resolution: workspace

# Its own package because it imports both halves: the studio, which cannot
# depend on a demo app, and the demo app's previews, which must not depend
# on the studio — a dev dependency that way drags the studio's native plugins
# into the demo app's registrants. `app/tool/demo/build_web.dart` builds
# it; `app/tool/demo/web_entries.dart` writes `demo/entries.g.dart`. Outside
# `lib/`, because the wrappers reach the demo app's previews by relative path
# and a `package:` URI cannot leave its package.
dependencies:
  brewline:
    path: ../examples/brewline
  flutter:
    sdk: flutter
  flutterware:
    path: ..
  flutterware_app:
    path: ../app
  material_ui: ^1.4.0

dev_dependencies:
  flutter_lints:
  flutter_test:
    sdk: flutter
  lints:
  path:

flutter:
  uses-material-design: true
