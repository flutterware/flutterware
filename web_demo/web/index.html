<!DOCTYPE html>
<html>
<head>
  <!--
    Replaced by `--base-href` when `tool/demo/build_web.dart` builds the page:
    the repository's Pages path in CI.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    What a chat or a search result shows under the link. The page names its
    tab once it runs; this is what is read before it does.
  -->
  <meta name="description" content="The flutterware studio in a browser, over a recording of a demo coffee-shop app: its previews, scenarios and comparisons, read-only.">

  <meta name="apple-mobile-web-app-title" content="flutterware">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>flutterware</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Drawn by the browser the moment the HTML arrives, so a visitor from the
    README sees the page starting rather than an empty one while the engine is
    fetched. Removed on the engine's first frame. In the studio's colours, and
    in its dark ones when the system is dark, which is the theme it opens in.
  -->
  <style>
    :root { --bg: #ffffff; --mut: #6b7280; --line: #e8eaee; --accent: #0553b1; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #15171f; --mut: #9a9dad; --line: #2a2e3c; --accent: #42a5f5; }
    }
    html, body { margin: 0; height: 100%; background: var(--bg); }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--mut);
    }
    #loading .ring {
      width: 18px;
      height: 18px;
      border: 2px solid var(--line);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: loading-spin 0.8s linear infinite;
    }
    @keyframes loading-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #loading .ring { animation: none; }
    }
  </style>
</head>
<body>
  <div id="loading" role="status">
    <div class="ring"></div>
    <div>Loading the studio…</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('loading');
      if (loading) loading.remove();
    });
  </script>
  <!--
    Flutter's own loader. The template this replaces registered a service
    worker and waited for it to activate before loading anything — a worker
    `build_web.dart` asks Flutter not to make, so the file it registered is
    empty. It cost a round trip and nothing more, but it is the template
    Flutter has deprecated, and a missing or slow worker would have left the
    page blank until its four-second fallback.
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
