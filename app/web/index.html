<!DOCTYPE html>
<html>
<head>
  <!--
    Replaced by `setBaseHrefIn` when a page is exported, so one compiled bundle
    serves every mount point.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    What a chat or an issue tracker shows under the link, so it has to fit both
    pages this bundle becomes: a comparison and a scenario run.
  -->
  <meta name="description" content="A flutterware report: what a branch changed in an app's previews and scenarios, or what a scenario run showed, frame by frame.">

  <meta name="apple-mobile-web-app-title" content="flutterware">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>flutterware</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Drawn by the browser the moment the HTML arrives. A reader arriving from a
    pull-request comment otherwise stares at an empty page for as long as the
    engine takes to fetch and start — seconds on a cold cache — and an empty
    page reads as a broken link. The engine announces its first frame, and
    that frame is the page's own loading state.
  -->
  <style>
    html, body { margin: 0; height: 100%; background: #ffffff; }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #6b7280;
    }
    #loading .ring {
      width: 18px;
      height: 18px;
      border: 2px solid #e8eaee;
      border-top-color: #0553b1;
      border-radius: 50%;
      animation: loading-spin 0.8s linear infinite;
    }
    @keyframes loading-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #loading .ring { animation: none; }
    }
  </style>
</head>
<body>
  <div id="loading" role="status">
    <div class="ring"></div>
    <div>Loading the report…</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('loading');
      if (loading) loading.remove();
    });
  </script>
  <!--
    Flutter's own loader, with no service worker. The template this replaces
    registered one — a caching worker, since the bundle was built with one —
    and loaded nothing until it activated, which meant after the worker had
    fetched the page's files. Served from a local server, every load ran into
    the template's four-second fallback instead.
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
