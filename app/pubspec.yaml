name: flutterware_app
description: A collection of GUI tools for Flutter apps development.

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 0.6.0+1

environment:
  sdk: ^3.13.0

resolution: workspace

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  analyzer:
  args:
  async:
  auto_size_text:
  built_collection:
  # The one clock a widget test can move. See lib/src/ui/startup_progress.dart.
  clock:
  # The vocabulary `hooks_runner` speaks for native code — the extension the
  # bundle builder asks with, and the link modes it maps into
  # `NativeAssetsManifest.json`. Rides the `hooks_runner` pin's resolution.
  code_assets:
  collection:
  crypto:
  dart_mcp: ^0.5.2
  dart_style:
  device_frame:
  diacritic:
  ffi:
  # `hooks_runner` takes a `FileSystem`.
  file:
  file_picker:
  file_selector:
  flutter:
    sdk: flutter
  flutter_markdown_plus:
  flutter_svg:
  flutter_web_plugins:
    sdk: flutter
  flutterware:
  github:
  glob:
  # Pinned, and to the version `flutter_tools` pins at the SDK in `.fvmrc` —
  # `app/test/build_hooks_pin_test.dart` fails when they drift. Two reasons, and
  # the second is the one that bites: a hook and the runner negotiate a
  # protocol version, so the runner the SDK's own consumers were resolved
  # against is the one that speaks to them; and the newest (1.6.3) requires
  # `code_assets ^2.0.0`, which evicts `native_toolchain_c` and drags `sqlite3`
  # back a major version under the Server panel. 1.6.1 adds one package and
  # changes nothing else.
  hooks_runner: 1.6.1
  # The generator's own parser, so the splash panel reads `web/index.html` back
  # the way `flutter_native_splash` wrote it.
  html:
  http:
  image:
  intl:
  io:
  json_annotation:
  logging:
  lottie:
  markdown:
  material_ui: ^1.4.0
  meta:
  more:
  os_detect:
  package_config:
  package_info_plus:
  path:
  path_drawing:
  path_provider:
  petitparser:
  pool:
  process:
  pub_scores:
    git:
      url: https://github.com/xvrh/pub-scores.git
      ref: master
  pub_semver:
  pubspec_parse:
  shelf:
  shelf_router:
  shelf_web_socket:
  standard_message_codec: ^0.0.1+5
  stream_channel:
  stream_transform:
  # Backs FwTable's virtualization and pinned rows/columns. See
  # app/lib/src/ui/table.dart.
  two_dimensional_scrollables:
  url_launcher:
  vector_math:
  vm_service: ^15.0.0
  watcher:
  web:
  web_socket_channel:
  win32:
  # Reads back the Android resources flutter_native_splash writes — styles.xml
  # and launch_background.xml — so the preview can be checked against what
  # actually shipped. See app/lib/src/splash/model/recompose.dart. The launcher
  # icon panel reads the manifest and the adaptive-icon XML the same way — see
  # app/lib/src/launcher_icon/model/wiring.dart.
  xml:
  yaml:
  # Surgical edits to a splash config that leave the rest of the file — comments,
  # key order, quoting style — exactly as the author wrote it. A round-trip
  # through `loadYaml` and back would not.
  # See app/lib/src/splash/model/writer.dart.
  yaml_edit:

dev_dependencies:
  build_runner:
  fake_async:
  # Lets a widget test stand in for the file picker, so the studio's whole loop —
  # pick, crop, write, set the key — is covered without a test-only parameter on
  # the production dialog. See app/test/splash/splash_studio_dialog_test.dart.
  file_selector_platform_interface:
  flutter_test:
    sdk: flutter
  json_serializable:
  lints:
  # `MockPlatformInterfaceMixin`, which is how a fake is allowed past
  # `PlatformInterface.verify`.
  plugin_platform_interface:
  # The compiled web demo, opened in a real browser by
  # `integration_test/web_demo_test.dart`. puppeteer fetches its own Chrome
  # into `.dart_tool/puppeteer/` on first use.
  puppeteer:
  shelf_static:
  test:
# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/

  # The scene tests' own shaders: `flutter test` compiles what the package
  # declares, and nothing else can put a program in a test's bundle.
  shaders:
    - test/scene/shaders/probe.frag
    - test/scene/shaders/probe_bare.frag

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
