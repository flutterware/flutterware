name: flutterware_probes
description: A new Flutter project.

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 2.0.0+1

environment:
  # 3.10 for the dot shorthands `tool/flutterware.dart` uses.
  sdk: ^3.13.0-0

resolution: workspace

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  android_id:
  auto_size_text:
  collection:
  device_info_plus:
  flutter:
    sdk: flutter
  flutter_gpu:
    sdk: flutter
  # **Pinned below 11, because 11 is ahead of the whole toolchain we pin.**
  # `flutter_secure_storage 11.0.0` sets `compileSdk = 37` and makes every app
  # that depends on it compile against 37 too; Flutter 3.48 pins compileSdk 36
  # and AGP 9.1.0 reports 36 as the highest it recommends, so the Android build
  # fails outright at `checkDebugAarMetadata`. 10.x asks for 36 and the panel
  # here only calls `readAll` and `delete`, which both versions have.
  #
  # Drop the constraint when Flutter's own `compileSdkVersion` reaches 37 —
  # `packages/flutter_tools/lib/src/android/gradle_utils.dart` is where it is
  # written. Measured 2026-08-24.
  flutter_scene: ^0.23.0
  flutter_secure_storage: ^11.2.0
  flutterware:
    path: ../..
  hooks: ^2.2.0
  # `test/scenarios/events_test.dart` signs in over a real request.
  http:
  logging:
  material_ui: ^1.4.0
  os_detect:
  package_info_plus:
  path:
  path_provider:
  # For lib/renders.dart — the render-bundle example's document entry.
  pdf:
  shared_preferences:
  # For bin/example_server.dart — the server-inspection example.
  shelf:
  # For lib/src/database/app_database.dart — the db-panel dogfood.
  sqlite3_flutter_libs:
  sqlite_async:
  vector_graphics: ^1.2.3
  vector_math: ^2.4.2

dev_dependencies:
  flutter_lints:
  flutter_native_splash: ^2.4.0
  flutter_test:
    sdk: flutter
  lints:
  # For test/scenarios/database_test.dart — the native-assets guard; the file
  # says why it is the synchronous API and not `sqlite_async`.
  sqlite3:
  test:
  vector_graphics_compiler: ^1.3.0
# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:

  # The Android side declares product flavors (see android/app/build.gradle.kts),
  # but deliberately no `default-flavor` here: the flutter tool applies that
  # field on every platform, and on macOS and iOS it then demands an Xcode
  # scheme named after a flavor only Android has — no desktop or iOS launch
  # survives it (measured on Flutter 3.48.0-0.2.pre). The Android pairing lives
  # in tool/flutterware.dart (`flavorByPlatform`), so cockpit launches still
  # need no argument; a bare `flutter run` on Android must say --flavor.

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Fixtures for the asset inspector — see assets/README.md for what each one
  # is meant to expose. Several of these are wrong on purpose.
  assets:
    - assets/images/
    # The shop's copy, one file per locale — a loader-based catalog, which is
    # what `fw.use(Translations(...))` in the repo root points at.
    # The *listing's* copy, separate from the app's — decision 9 of the store
    # design. A headline is never shown in the app.
    - assets/store/
    - assets/icons/check.svg
    - path: assets/icons/heart.svg
    # Compiled by an asset transformer, so what a build ships — and what the
    # test lane serves — is the binary `vector_graphics` format rather than the
    # XML on disk. The fixture for `test/scenarios/vector_graphics_test.dart`.
    - path: assets/icons/illustration.svg
      transformers:
        - package: vector_graphics_compiler
    - assets/animations/
    # The 3D probes' fixture — see tool/make_probe_rig_glb.dart.
    - assets/models/
    # What hook/build.dart converts it into. Managed by the hook; ignored.
    - flutter_scene_generated/

  # A scene text layer's paint — demo/foil_title.scene.dart.
  shaders:
    - shaders/foil.frag

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    # A VARIABLE face, for the scene editor's axis sliders and for a headline
    # that morphs along wght and wdth — which is the thing a set of static
    # weights cannot do. Archivo, by the Omnibus-Type authors, under the SIL
    # Open Font License 1.1; the licence travels beside the file.
    # wght 100..900 (default 600), wdth 62..125 (default 100).
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-Variable.ttf
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
