# The lab's sync stack: Postgres, and a PowerSync service replicating the shop's
# orders from it to every app that may see them. The lab server stays on the
# host — a world hosts it in its own process — and writes to this Postgres.
#
#   docker compose -f fixtures/world_lab/stack/compose.yaml up -d --wait
#
# Nothing is kept in a volume: `down` forgets everything, which is what a world
# wants — it makes its people fresh every time anyway.
name: world-lab

services:
  postgres:
    image: postgres:17
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shop
    ports:
      - "55432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shop"]
      interval: 1s
      timeout: 3s
      retries: 30

  powersync:
    image: journeyapps/powersync-service:1.26.1
    command: ["start", "-r", "unified"]
    environment:
      POWERSYNC_CONFIG_PATH: /config/powersync.yaml
    volumes:
      - ./powersync.yaml:/config/powersync.yaml:ro
    ports:
      - "58080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/probes/liveness').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 1s
      timeout: 3s
      retries: 60
