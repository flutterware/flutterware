<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Flutterware</title>
  <meta name="robots" content="noindex">
  <!--
    Absolute paths: Pages serves this file for a missing URL at any depth, so
    a relative one would resolve against wherever the visitor got lost.
  -->
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="brand" href="/">
        <img src="/icon.svg" alt="" width="28" height="28">
        flutterware
      </a>
    </div>
  </header>
  <main class="lost">
    <div class="wrap">
      <h1>There's no page here</h1>
      <p>The link may be old, or the page may have moved.</p>
      <div class="actions">
        <a class="button primary" href="/">Go to the home page</a>
        <a class="button" href="/demo/">Open the web demo</a>
      </div>
    </div>
  </main>
</body>
</html>
