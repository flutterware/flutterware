name: flutterware_render
description: Render Flutter widgets to SVG, PNG and PDF, in a test or from a Dart server.
version: 0.7.0 # Keep it sync with flutterware
# Not on pub.dev: a project takes it as a git dependency, at the tag of the
# flutterware release it uses (see doc/renders.md).
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  # Exactly the release this one is tagged with: the capture pipeline imports
  # flutterware's own sources (the offscreen mount, the wire protocol), which
  # promise nothing across versions. `tool/release.dart` moves it.
  flutterware: 0.7.0
  pdf: ^3.11.0
  vector_math: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  material_ui: ^1.4.0
