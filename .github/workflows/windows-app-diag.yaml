# Temporary diagnostic, never merged: subsets of the app suite on Windows,
# in rounds, under a watchdog that posts to commit statuses so a runner that
# freezes still says which round it froze in.
name: Windows app suite diagnostic
on:
  push:
    branches:
      - diag/windows-app-suite

permissions:
  contents: read
  statuses: write

jobs:
  app_subset:
    name: Windows ${{ matrix.mode }}
    runs-on: windows-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: window-1
            fix: ''
            files: test/previews/capture_test.dart test/previews/catalog_params_test.dart test/previews/catalog_picture_test.dart test/previews/catalog_roots_test.dart test/previews/catalog_session_dispose_test.dart test/previews/catalog_tree_test.dart test/previews/catalog_view_test.dart test/previews/compile_blame_test.dart test/previews/daemon_client_test.dart test/previews/daemon_config_test.dart test/previews/daemon_depfile_test.dart
          - mode: window-2
            fix: ''
            files: test/previews/capture_test.dart test/previews/catalog_params_test.dart test/previews/catalog_picture_test.dart test/previews/catalog_roots_test.dart test/previews/catalog_session_dispose_test.dart test/previews/catalog_tree_test.dart test/previews/catalog_view_test.dart test/previews/compile_blame_test.dart test/previews/daemon_client_test.dart test/previews/daemon_config_test.dart test/previews/daemon_depfile_test.dart
          - mode: window-fix-1
            fix: '1'
            files: test/previews/capture_test.dart test/previews/catalog_params_test.dart test/previews/catalog_picture_test.dart test/previews/catalog_roots_test.dart test/previews/catalog_session_dispose_test.dart test/previews/catalog_tree_test.dart test/previews/catalog_view_test.dart test/previews/compile_blame_test.dart test/previews/daemon_client_test.dart test/previews/daemon_config_test.dart test/previews/daemon_depfile_test.dart
          - mode: window-fix-2
            fix: '1'
            files: test/previews/capture_test.dart test/previews/catalog_params_test.dart test/previews/catalog_picture_test.dart test/previews/catalog_roots_test.dart test/previews/catalog_session_dispose_test.dart test/previews/catalog_tree_test.dart test/previews/catalog_view_test.dart test/previews/compile_blame_test.dart test/previews/daemon_client_test.dart test/previews/daemon_config_test.dart test/previews/daemon_depfile_test.dart
          - mode: sockets
            fix: ''
            files: test/previews/catalog_session_dispose_test.dart test/previews/daemon_client_test.dart test/utils/run_dir_test.dart
          - mode: capture
            fix: ''
            files: test/previews/capture_test.dart
    steps:
      - uses: actions/checkout@v2
      - name: Read the pinned Flutter version
        id: pin
        shell: bash
        run: |
          version="$(sed -n 's/.*"flutter"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .fvmrc)"
          case "$version" in *-*) channel=beta ;; *) channel=stable ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.pin.outputs.version }}
          channel: ${{ steps.pin.outputs.channel }}
      - run: flutter --version
      - run: flutter pub get
      - name: Subset in rounds under a watchdog
        shell: pwsh
        timeout-minutes: 35
        continue-on-error: true
        working-directory: app
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          $log = Join-Path $PWD 'build\watchdog.log'
          $stop = Join-Path $PWD 'build\watchdog.stop'
          $report = Join-Path $PWD 'build\none.json'
          Start-Process pwsh -WindowStyle Hidden -ArgumentList @('-NoProfile', '-File', '..\tool\ci\watchdog.ps1', '-Log', $log, '-StopFile', $stop, '-Report', $report, '-Name', '${{ matrix.mode }}') | Out-Null
          $api = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA"
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = 'application/vnd.github+json' }
          if ('${{ matrix.fix }}' -eq '1') { $env:FW_DIAG_FIX = '1' }
          $files = '${{ matrix.files }}'.Split(' ')
          $code = 0
          for ($i = 1; $i -le 10; $i++) {
            "=== round $i"
            Set-Content build\round.txt "r$i"
            $body = @{ state = 'pending'; context = 'diag/${{ matrix.mode }}/round'; description = "round $i starts" } | ConvertTo-Json
            try { Invoke-RestMethod -Method Post -Uri $api -Headers $headers -Body $body -TimeoutSec 10 | Out-Null } catch { "post failed: $_" }
            flutter test @files --reporter expanded
            if ($LASTEXITCODE -ne 0) { $code = $LASTEXITCODE }
          }
          $body = @{ state = 'success'; context = 'diag/${{ matrix.mode }}/round'; description = "all rounds done, exit $code" } | ConvertTo-Json
          try { Invoke-RestMethod -Method Post -Uri $api -Headers $headers -Body $body -TimeoutSec 10 | Out-Null } catch { "post failed: $_" }
          New-Item -ItemType File $stop | Out-Null
          Start-Sleep -Seconds 5
          exit $code
      - name: What the watchdog saw
        if: always()
        shell: pwsh
        working-directory: app
        run: |
          if (Test-Path build\watchdog.log) {
            Select-String -Path build\watchdog.log -Pattern 'KILL|failed|error'
            '--- last samples ---'
            Get-Content build\watchdog.log -Tail 20
          } else { 'no watchdog log' }
