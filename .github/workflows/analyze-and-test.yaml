name: Flutterware
on:
  pull_request:
  push:
    branches:
      - master

jobs:
  analyze_and_test:
    name: Flutter analyze
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v2
      # CI runs the exact version `.fvmrc` records, not whatever a channel
      # resolves to today. fvm itself is not installed here — it is one way to
      # put the pinned SDK on PATH and a runner has cheaper ones. What has to
      # match is the *version*, and that is read from the same committed file
      # a laptop reads.
      #
      # The channel is derived rather than pinned separately: a prerelease
      # carries a `-`, and hard-coding `beta` would break the day the pin moves
      # to a stable.
      - name: Read the pinned Flutter version
        id: pin
        run: |
          version="$(sed -n 's/.*"flutter"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .fvmrc)"
          if [ -z "$version" ]; then echo "::error::.fvmrc names no Flutter version"; exit 1; fi
          case "$version" in *-*) channel=beta ;; *) channel=stable ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.pin.outputs.version }}
          channel: ${{ steps.pin.outputs.channel }}
      # From here `flutter` and `dart` are the pinned SDK, put on PATH by the
      # step above. That is an invocation, deliberately made — not the ambient
      # toolchain `test/ambient_sdk_test.dart` keeps out of the source.
      - run: flutter --version
      - run: flutter pub get
      # The pin and the published floors are two numbers on purpose, and
      # nothing used to notice when they drifted into each other. They did:
      # `flutter: '>=3.47.0-0'` reached a package whose last published floor
      # was `>=3.21.0`, which no one on stable could have installed. This step
      # only catches the half that breaks *us* — a floor risen above the pin,
      # so the repo no longer builds on the SDK it says it develops on. The
      # other half, a floor lower than what the code needs, is a claim only
      # running an older SDK could disprove, and nothing here does.
      - run: dart tool/bump_flutter.dart --check
      - run: flutter analyze
      - run: flutter test
        working-directory: app
      # The shader pixel tests again on Impeller: a paragraph freezing its
      # shader is engine behaviour, and the mask path has to hold on both.
      - run: flutter test --enable-impeller test/scene/scene_shader_paint_test.dart test/scene/scene_shader_capture_test.dart
        working-directory: app
      # The root package's own tests. Separate because a pub workspace does not
      # run its members' suites — without this line `test/` here is analyzed
      # and never executed, which is how the inspection wire format sat
      # unguarded while looking covered.
      - run: flutter test
      - run: dart tool/prepare_submit.dart
      - name: "check for uncommitted changes"
        run: |
          git diff --exit-code --stat -- . ':(exclude)*pubspec.lock' \
          || (echo "##[error] found changed files after build. please run 'fvm dart tool/prepare_submit.dart'" \
                   "and check in all changes" \
              && exit 1)
        shell: bash
      - name: "fw finds its own install"
        # The one thing that runs `fw` as a *process*, from a project that is not
        # the app package, and reaches a plugin action that needs the daemon.
        #
        # It exists because that combination had two independent bugs and nothing
        # could see either. `PreviewsCore` passed the target package as
        # `appPackageRoot`, so the launch machinery looked for
        # `tool/catalog/compiler_daemon.dart` inside the user's project; and once
        # that was fixed, `dart run app/bin/fw.dart` still had no
        # `APP_TOOL_PATH`, because only the launcher sets it. Every headless
        # previews action — screenshot, inspect, describe --with-knobs, check,
        # audit —
        # was broken from `fw` in an ordinary project, in both cases.
        #
        # `headless_check` could not catch it: it builds its own `DaemonConfig`,
        # which is the very step that was wrong, and it runs in-process, which
        # skips how `fw` resolves its own install. A unit test cannot either,
        # since that resolution reads `Platform.script` and the environment.
        # Running the binary is the whole point.
        #
        # `check` and not `screenshot` so this can *block*: it stops at the
        # daemon handshake, launching no guest, so it needs no GPU — which is
        # exactly why the step below cannot block.
        run: dart run ../../app/bin/fw.dart run previews check
        working-directory: fixtures/probe_app

      - name: "and finds it when started by package name"
        # The same resolution, from the other way this package is started: by
        # name rather than by file. `.mcp.json` used to run `dart run
        # flutterware_app:mcp`, whose `Platform.script` is a snapshot under
        # `.dart_tool/pub/bin/` — two directories above which is nothing, so the
        # step above stayed green while every previews and motion action over
        # MCP died on a daemon script at a path that never existed.
        #
        # `flutterware_app:fw` and not `:mcp` because the CLI takes the same
        # session down the same daemon handshake and can say so with an exit
        # code; talking MCP from a workflow step would test the transport, not
        # the resolution.
        run: dart run flutterware_app:fw run previews check
        working-directory: fixtures/probe_app

      - name: "the compiler daemon, as a process"
        # Everything in `app/integration_test/` that needs no GPU: the daemon
        # starting, quarantining a demo it cannot compile, noticing an edit on
        # disk, sharing one warm compiler between two clients without letting
        # either decide what the other gets, announcing the servable set to a
        # client that did not ask, and surviving a line it cannot read.
        #
        # `dart test`, not `flutter test`: anything under `integration_test/`
        # makes `flutter test` demand a device and `package:integration_test`,
        # and these are plain VM tests that spawn processes.
        #
        # `--exclude-tags gpu` leaves out the checks that spawn the embedder
        # guest, which composites through Metal — see `app/dart_test.yaml`. That
        # is what lets this step block: a check nobody can fail is not a check,
        # and the step it replaces was `continue-on-error` from the day it was
        # written to the day it was deleted.
        run: dart test integration_test --exclude-tags gpu,browser
        working-directory: app


  pub_score:
    name: pub.dev score
    # **Full marks, enforced.** The published 0.5.1 sat at 50/160 for two years
    # — it failed static analysis against a Flutter that had moved under it, so
    # pana could not infer platform support and the pub.dev page showed no
    # platform chips at all. Nothing in this repo noticed, because nothing here
    # was looking. This job is what looks.
    #
    # It asserts `granted == max` rather than `>= 160`. The rubric is pana's and
    # it moves: the same package scored out of 130 before pana added categories.
    # A number hard-coded here would be a number to forget; "lose no points" is
    # the actual policy and it survives the rubric changing.
    #
    # Ubuntu, not macOS: pana compiles nothing and renders nothing, so the
    # expensive runner buys it nothing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      # The same pin every other job reads, for the same reason.
      - name: Read the pinned Flutter version
        id: pin
        run: |
          version="$(sed -n 's/.*"flutter"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .fvmrc)"
          if [ -z "$version" ]; then echo "::error::.fvmrc names no Flutter version"; exit 1; fi
          case "$version" in *-*) channel=beta ;; *) channel=stable ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.pin.outputs.version }}
          channel: ${{ steps.pin.outputs.channel }}
      - run: flutter --version
      # Pinned on purpose. pana is the grader, and an unpinned grader means a
      # release on somebody else's schedule can turn this repo red on a morning
      # nobody touched it. Bumping it is a deliberate act, and the bump is where
      # a new category gets read and answered.
      - run: dart pub global activate pana 0.23.19
      - name: Score the package
        run: dart pub global run pana --no-warning --json . > pana.json
      - name: Lose no points
        run: |
          granted=$(jq '[.report.sections[].grantedPoints] | add' pana.json)
          max=$(jq '[.report.sections[].maxPoints] | add' pana.json)
          echo "## pub.dev score: $granted / $max" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          jq -r '.report.sections[]
                 | "- \(.grantedPoints)/\(.maxPoints) \(.status) — \(.title)"' \
            pana.json | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$granted" != "$max" ]; then
            echo "::error::pana scores $granted/$max. Every section has to be full."
            # The summaries of what did not pass, so the log says why rather
            # than only that.
            jq -r '.report.sections[] | select(.status != "passed") | .summary' pana.json
            exit 1
          fi
          echo "pana: $granted/$max"

  demo_export:
    name: Demo export
    # `examples/brewline` is the demo a stranger clones. It is a workspace
    # member here, which is what lets the root resolve it against this
    # checkout, and `tool/publish_example.dart` projects its tracked tree to a
    # repository of its own with the one workspace line removed. This job is
    # the only thing that proves the projection stands on its own: it resolves,
    # analyzes and runs its tests from the clone the script stages, not from
    # the checkout. The override is the clone's, never the demo's — the code
    # under review is what its snippets have to compile against, published or
    # not.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Read the pinned Flutter version
        id: pin
        run: |
          version="$(sed -n 's/.*"flutter"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .fvmrc)"
          if [ -z "$version" ]; then echo "::error::.fvmrc names no Flutter version"; exit 1; fi
          case "$version" in *-*) channel=beta ;; *) channel=stable ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.pin.outputs.version }}
          channel: ${{ steps.pin.outputs.channel }}
      - run: flutter pub get
      - name: Stage the projection
        run: dart tool/publish_example.dart --dry-run
      - name: The clone resolves, analyzes and tests on its own
        working-directory: build/flutterware_example
        run: |
          printf 'dependency_overrides:\n  flutterware:\n    path: ../..\n' > pubspec_overrides.yaml
          flutter pub get
          flutter analyze
          flutter test

  previews_audit_linux:
    name: Previews audit on Linux
    # The audit's whole bring-up — spawning `flutter_tester`, compiling the
    # framework's default shaders with `impellerc`, linking
    # `isolate_snapshot.bin` into the asset bundle — reads artifacts out of
    # `engine/<host>/`, and every one of those paths was once hard-coded to
    # `darwin-x64`. Development happens on macOS, where that mistake is
    # invisible; this job is the only thing that would catch it coming back.
    #
    # It can block because nothing here needs a GPU *device*: measured
    # 2026-08-26, `flutter_tester --enable-impeller --enable-flutter-gpu`
    # brings a context up on a bare `ubuntu-latest` with no driver installed
    # and nothing added to the image. The host `artifacts.zip` (tester,
    # impellerc, ICU data, snapshots) is in the universal bucket any `flutter`
    # command downloads.
    #
    # Since `demo/gpu_smoke.dart` renders through Flutter GPU and is not
    # allowed to catch its own failure, this job is also what says the
    # rasterizer still carries it here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      # The same pin the macOS job reads, for the same reason.
      - name: Read the pinned Flutter version
        id: pin
        run: |
          version="$(sed -n 's/.*"flutter"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .fvmrc)"
          if [ -z "$version" ]; then echo "::error::.fvmrc names no Flutter version"; exit 1; fi
          case "$version" in *-*) channel=beta ;; *) channel=stable ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.pin.outputs.version }}
          channel: ${{ steps.pin.outputs.channel }}
      - run: flutter --version
      - run: flutter pub get
      # `audit`, not `check`: `check` stops at the daemon handshake and never
      # spawns a tester, so it proves nothing about the artifact paths this
      # job exists for. `fw` exits 1 when the audit reports `ok: false`, so a
      # broken example entry — or a tester that cannot come up — fails the job.
      - run: dart run flutterware_app:fw run previews audit
        working-directory: fixtures/probe_app
      # The 3D lane, walked: a scene with a model, two screens and a
      # crossfade, rendered frame by frame through flutter_scene on the
      # tester. The audit above renders the 3D probes as stills; this is the
      # motion, and the one place the export path runs off macOS.
      - run: flutter test test/previews/showcase_export_test.dart test/previews/phone_rig_probe_test.dart
        working-directory: app

  previews_audit_windows:
    name: Previews audit on Windows
    # The Linux job's twin, and it exists for a sharper reason than symmetry:
    # until 2026-08-26 previews and scenarios did not run on Windows *at all*.
    # Every compile died inside the front end on `StandardFileSystem only
    # supports file:* and data:* URIs` — a bare `C:\...` handed to something
    # that parses URIs reads as the scheme `c:` — and the audit reported the
    # package unreachable with a bare `Bad state: No elements`. Nothing caught
    # it because nothing ran previews on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v2
      - name: Read the pinned Flutter version
        id: pin
        shell: bash
        run: |
          version="$(sed -n 's/.*"flutter"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .fvmrc)"
          if [ -z "$version" ]; then echo "::error::.fvmrc names no Flutter version"; exit 1; fi
          case "$version" in *-*) channel=beta ;; *) channel=stable ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.pin.outputs.version }}
          channel: ${{ steps.pin.outputs.channel }}
      - run: flutter --version
      - run: flutter pub get
      - run: dart run flutterware_app:fw run previews audit
        working-directory: fixtures/probe_app
      # Scenarios share the harness previews audit on, so a Windows break in
      # either is usually a break in both — but only this one spawns a run.
      - run: dart run flutterware_app:fw run scenarios run --steps=none
        working-directory: fixtures/probe_app
      # The 3D lane on Windows. One file a step, unlike Linux: run together
      # they exited 1 with all nine tests passing, no error printed, six of
      # the results uncounted and a flutter_tester left orphaned — a suite
      # that did not shut down cleanly rather than a test that failed. Split,
      # the next red says which file owns it.
      - run: flutter test test/previews/showcase_export_test.dart
        working-directory: app
      - run: flutter test test/previews/phone_rig_probe_test.dart
        working-directory: app
      # The probe writes every frame of every walk; when a walk is not
      # order-free on this runner and nowhere else, the pictures are the
      # only way to see what differed.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: phone-rig-probe-frames
          path: app/build/phone_rig_probe

  suites_windows:
    name: Suites on Windows
    # Nothing ran either test suite on Windows before this job, and a Windows
    # checkout could not even format: `prepare_submit` looped forever on a
    # path git spells `C:/…` and `dart:io` spells `C:\…`, and Git for Windows'
    # CRLF checkout left every tool-rewritten file looking modified. See
    # `docs/superpowers/specs/2026-09-14-windows-support-plan.md`.
    #
    # The formatter and the root suite block: both are green on Windows now,
    # and a checkout is all they need. The app suite does not block yet —
    # measured 2026-09-14 on a Windows laptop, 210 of the tests that ran
    # failed, most on shell fakes (`true`, `sleep`, `chmod`) and on process
    # handling that assumes POSIX signals — the plan's steps 2 and 4. It runs
    # here so that number is visible on every PR and its JSON is one download
    # away, and it blocks once the plan's steps 2–4 have brought it to zero.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v2
      - name: Read the pinned Flutter version
        id: pin
        shell: bash
        run: |
          version="$(sed -n 's/.*"flutter"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .fvmrc)"
          if [ -z "$version" ]; then echo "::error::.fvmrc names no Flutter version"; exit 1; fi
          case "$version" in *-*) channel=beta ;; *) channel=stable ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.pin.outputs.version }}
          channel: ${{ steps.pin.outputs.channel }}
      - run: flutter --version
      - run: flutter pub get
      # Bounded, because the failure this guards against is a hang, not a red.
      - run: dart tool/prepare_submit.dart
        timeout-minutes: 10
      # After `pub get` rewrote the plugin registrants and the formatter ran:
      # the two things that used to leave a Windows checkout dirty.
      - name: "check for uncommitted changes"
        run: |
          git diff --exit-code --stat -- . ':(exclude)*pubspec.lock' \
          || (echo "##[error] found changed files on Windows — a CRLF checkout, or a tool writing a different line ending" \
              && exit 1)
        shell: bash
      - run: flutter test
        timeout-minutes: 20
      - name: The app suite, reported rather than enforced
        continue-on-error: true
        timeout-minutes: 60
        run: flutter test --file-reporter json:build/app-suite-windows.json
        working-directory: app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-suite-windows
          path: app/build/app-suite-windows.json
          if-no-files-found: ignore

  studio_demo:
    name: Studio demo
    # The studio over a recording — `docs/superpowers/specs/
    # 2026-09-10-studio-over-a-fake-project-design.md`. Three things this job
    # keeps true, each of which broke silently before it existed: the
    # recording in `app/demo/fixture/` is what `tool/demo/record.dart` produces
    # from `fixtures/probe_app` today (a scan format that moved without the
    # recording moving would otherwise read as a fixture bug); the studio's own
    # scenario walks the shell under the harness; and the shell still compiles
    # for the web, which one `dart:ffi` import anywhere in its closure ends.
    #
    # Ubuntu, because none of it needs a GPU or a macOS toolchain: the
    # recording is a directory listing, the scenario runs on `flutter_tester`
    # (see the Linux audit job for why that is fine here), and the web build
    # is dart2js.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Read the pinned Flutter version
        id: pin
        run: |
          version="$(sed -n 's/.*"flutter"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .fvmrc)"
          if [ -z "$version" ]; then echo "::error::.fvmrc names no Flutter version"; exit 1; fi
          case "$version" in *-*) channel=beta ;; *) channel=stable ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.pin.outputs.version }}
          channel: ${{ steps.pin.outputs.channel }}
      - run: flutter --version
      - run: flutter pub get
      - name: "the recording is what the tool records today"
        # Re-records and expects no diff. The recorder pins every mtime to the
        # project clock, so a fresh checkout records the same bytes as the
        # laptop that committed them. The launcher-icon half only: the
        # scenario half is rendered pixels, which are not byte-stable across
        # operating systems, and is recorded from one machine on purpose —
        # see the spec's "facts and pictures".
        run: |
          dart run tool/demo/record.dart --only=launcher-icon
          dart run tool/demo/record.dart --only=server
          dart run tool/demo/record.dart --only=stack
          dart run tool/demo/record.dart --only=splash
          dart run tool/demo/record.dart --only=changes
          git diff --exit-code --stat -- demo/fixture \
            || (echo "##[error] app/demo/fixture is stale. Run 'cd app && fvm dart run tool/demo/record.dart' with '--only=launcher-icon', '--only=server', '--only=stack', '--only=splash' and '--only=changes', and commit the result." \
                && exit 1)
        working-directory: app
      - name: "the studio's own scenario, under the harness"
        # `flutter test` in the macOS job already runs this file as a widget
        # test; this is the harness lane — the shots, the walk, the run report
        # — which is the thing a scenario exists for.
        run: |
          dart run app/bin/fw.dart run scenarios run --package=app --device=window --steps=none
          dart run app/bin/fw.dart run scenarios run --package=web_demo --device=window --steps=none
      - name: "the page is built, with the recording beside it"
        # `tool/demo/build_web.dart` is `flutter build web` on the demo entry
        # point plus the recording copied next to `index.html`, which is where
        # the page fetches it from — the recording is deliberately not an
        # asset of the app (see `app/lib/src/demo/recording.dart`).
        # `--base-href` is the repository's Pages path, which is where the
        # deploy job below puts it.
        run: dart run tool/demo/build_web.dart --base-href "/${{ github.event.repository.name }}/"
        working-directory: app
      # puppeteer's Chrome, ~150 MB, keyed on the lockfile so a puppeteer bump
      # fetches the browser it wants and nothing else does.
      - uses: actions/cache@v4
        with:
          path: .dart_tool/puppeteer
          key: puppeteer-chrome-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
      - name: "the page opens in a browser and walks to a recorded panel"
        # The compile above proves the shell builds without a filesystem;
        # this proves it *runs* without one. Chrome opens the directory the
        # deploy job is about to publish, served under the same path, and
        # walks the rail through the semantics tree. A JavaScript error, a
        # failed request or a panel that never draws fails it with the list.
        run: dart test integration_test/web_demo_test.dart
        env:
          FW_WEB_DEMO_BUILD: build/web
        working-directory: app
      - uses: actions/upload-artifact@v4
        # One screenshot per step the browser took, green or red.
        if: always()
        with:
          name: studio-demo-shots
          path: app/build/web_demo/shots
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: studio-demo
          path: app/build/web
          retention-days: 7

  deploy_demo:
    name: Deploy the studio demo
    # Every push to master publishes the page the README links to. One-time
    # setup on the repository: Settings → Pages → Source: GitHub Actions.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: studio_demo
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: studio-demo
          path: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
